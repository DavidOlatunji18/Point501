apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: point501
spec:
  # Chroma's local persistence mode is single-writer (a plain directory on
  # disk, not a server multiple pods can share safely) - so this stays at
  # 1 replica. Not an oversight; scaling this out for real would mean
  # running Chroma in server mode (or swapping to a managed vector DB)
  # first.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: point501-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-credentials
                  key: ANTHROPIC_API_KEY
          volumeMounts:
            - name: chroma-storage
              mountPath: /app/chroma_data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: chroma-storage
          persistentVolumeClaim:
            claimName: chroma-pvc
