# Template only - copy to db-secret.yaml (gitignored) and it works as-is
# for a local demo, since these are throwaway local credentials, not real
# production secrets. Real deployments should generate a random password.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: point501
type: Opaque
stringData:
  POSTGRES_USER: point501
  POSTGRES_PASSWORD: point501
  POSTGRES_DB: point501
  DATABASE_URL: postgresql+psycopg://point501:point501@postgres:5432/point501
